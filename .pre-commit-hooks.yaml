- id: kit-gate
  name: kit-gate (reglas del flujo de una tarea)
  description: Comprueba la rama de una tarea o del plan contra la rama base (D-0052).
  entry: skills/task-done/scripts/gate.py
  language: script
  stages: [pre-push, manual]
  pass_filenames: false
  always_run: true
- id: kit-context
  name: kit-context (rama, tarea y reglas del flujo para la sesión)
  description: Imprime la tarea de la rama y las reglas del flujo; nunca falla (R5).
  entry: skills/task-done/scripts/gate.py
  args: [--context]
  language: script
  stages: [manual]
  pass_filenames: false
  always_run: true
  verbose: true
