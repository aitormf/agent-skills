- id: harness-gate
  name: harness-gate (reglas del flujo de una tarea)
  description: Comprueba la rama de una tarea o del plan contra la rama base (D-0052).
  entry: skills/task-done/scripts/gate.py
  language: script
  stages: [pre-push, manual]
  pass_filenames: false
  always_run: true
- id: harness-context
  name: harness-context (rama, tarea y reglas del flujo para la sesión)
  description: Imprime la tarea de la rama y las reglas del flujo; nunca falla (R5).
  entry: skills/task-done/scripts/gate.py
  args: [--context]
  language: script
  stages: [manual]
  pass_filenames: false
  always_run: true
  verbose: true
- id: harness-review
  name: harness-review (review del push, tras el gate)
  description: Ejecuta el gate y, si no está en rojo, lanza el revisor; bloquea solo con un Crítico confirmado (D-0055).
  entry: skills/review-prepush/scripts/harness-review.sh
  language: script
  stages: [pre-push]
  pass_filenames: false
  always_run: true
