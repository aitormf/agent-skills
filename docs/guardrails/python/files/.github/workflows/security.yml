# Origen: plan-seguridad-codigo-ia.md §4.5. En producción, fijad las actions a un SHA completo.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"   # diario: nuevas CVE en dependencias que no han cambiado

permissions:
  contents: read           # mínimo privilegio para todo el workflow

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Vulnerabilidades conocidas (pip-audit sobre el lockfile)
        run: |
          uv export --frozen --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0               # la comparación con la base necesita el historial
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Semgrep (en PR, solo hallazgos introducidos por la PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          test -n "$BASE"   # sin base, fallar: evita que el check pase en silencio
          uvx semgrep scan --config p/python --config p/owasp-top-ten \
            --baseline-commit "$BASE" --error --metrics off
      - name: Semgrep (en main y diario, escaneo completo)
        if: github.event_name != 'pull_request'
        run: uvx semgrep scan --config p/python --config p/owasp-top-ten --error --metrics off

  # CodeQL: gratis en repos públicos; en privados requiere GitHub Advanced Security.
  # codeql:
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     security-events: write
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         persist-credentials: false
  #     - uses: github/codeql-action/init@v3
  #       with:
  #         languages: python
  #         build-mode: none
  #         queries: security-extended
  #     - uses: github/codeql-action/analyze@v3

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: zizmor
        run: uvx zizmor .github/workflows

  guardrails:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Unicode oculto en ficheros de agentes
        run: |
          git ls-files 'AGENTS.md' '**/AGENTS.md' 'CLAUDE.md' '**/CLAUDE.md' '.claude/**' '.mcp.json' '.github/**' \
            | xargs -r uv run python scripts/check_hidden_unicode.py
      - name: No silenciar reglas de seguridad sin justificar
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Un "# noqa: S…" nuevo exige el texto "security-reviewed:" con el motivo en la misma línea.
          if git diff "origin/$BASE_REF...HEAD" -- '*.py' \
             | grep -E '^\+.*noqa:.*\bS[0-9]{3}' | grep -v 'security-reviewed:'; then
            echo "::error::Hay '# noqa: S…' sin 'security-reviewed: <motivo>'."
            exit 1
          fi
