# Por qué: docs/arnes/herramientas-arnes.md §3.9 y §3.15, docs/arnes/plan-seguridad-codigo-ia.md §3.B.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7      # no proponer versiones publicadas hace menos de 7 días
    groups:
      dev:
        dependency-type: "development"
    commit-message:
      prefix: "chore"
      include: "scope"     # → "chore(deps): bump ..."

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
