# Why: docs/arnes/herramientas-arnes.md §4.3. In production, pin the actions to a full SHA.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked      # fails if uv.lock does not match pyproject.toml
      - run: ./scripts/check.sh

  kit-gate:
    # The kit's workflow gate, with the .pre-commit-config.yaml of the base branch: a PR cannot change the rev
    # of the kit or remove the hook to pass its own gate (D-0052).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: kit-gate
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          git show origin/$GITHUB_BASE_REF:.pre-commit-config.yaml > "$RUNNER_TEMP/pre-commit-base.yaml"
          uvx pre-commit run kit-gate --hook-stage manual --config "$RUNNER_TEMP/pre-commit-base.yaml"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history for gitleaks
          persist-credentials: false
      - name: gitleaks
        # The Docker image avoids the license gitleaks-action requires for organizations.
        # Pin a specific version instead of latest.
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose
