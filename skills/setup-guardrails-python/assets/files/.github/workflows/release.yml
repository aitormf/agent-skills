# Why: docs/arnes/herramientas-arnes.md §3.15. Release notes generated with git-cliff when a tag is pushed.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git-cliff needs the history and the tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      # The notes go through a file, not through outputs inside run:, to avoid injection from commits.
      - run: uvx git-cliff --latest --strip header -o RELEASE_NOTES.md
      - run: gh release create "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
