# Works with prek and pre-commit. After copying it: `prek autoupdate` (fills in the revs) and `prek install`.
# Why: docs/arnes/herramientas-arnes.md §4.2 and docs/arnes/plan-seguridad-codigo-ia.md §4.3.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: <version>
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: <version>
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: <version>
    hooks:
      - id: uv-lock          # uv.lock in sync with pyproject.toml

  - repo: https://github.com/gitleaks/gitleaks
    rev: <version>
    hooks:
      - id: gitleaks

  # Conventional Commits (commit-msg stage). Comment it out if you do not use them yet.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: <version>
    hooks:
      - id: commitizen

  # mypy and import-linter with `uv run` to use the versions in uv.lock.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      # - id: lint-imports
      #   name: import-linter
      #   entry: uv run lint-imports
      #   language: system
      #   types: [python]
      #   pass_filenames: false
      - id: hidden-unicode
        name: Hidden Unicode in agent files and docs
        entry: uv run python scripts/check_hidden_unicode.py
        language: system
        files: '(^|/)(AGENTS|CLAUDE)\.md$|^\.claude/|^\.cursor/|^\.mcp\.json$|^\.github/|^docs/.*\.md$'
      - id: zizmor
        name: zizmor (GitHub Actions security)
        entry: uvx zizmor
        language: system
        files: '^\.github/workflows/.*\.ya?ml$'
