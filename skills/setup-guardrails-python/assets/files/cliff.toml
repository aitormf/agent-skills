# Minimal git-cliff configuration. For the full changelog template: `uvx git-cliff --init`
# and keep this [git] section. Why: docs/arnes/herramientas-arnes.md §3.15.
#
# Release flow:
#   VERSION=$(uvx git-cliff --bumped-version)    # e.g. v1.4.0
#   uv version "${VERSION#v}"
#   uvx git-cliff --bump -o CHANGELOG.md
#   git commit -am "chore(release): $VERSION" && git tag "$VERSION"   # a person pushes

[git]
conventional_commits = true
filter_unconventional = true     # unformatted commits do not go into the changelog
protect_breaking_commits = true  # a breaking change is never omitted
tag_pattern = "v[0-9].*"
commit_parsers = [                # the first matching rule wins
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^(chore|ci|test|style|build)", skip = true },
]
