# Fragment to merge into the project's pyproject.toml (not a complete pyproject).
# Dev dependencies are added with `uv add --dev ...`, not by copying versions from here.
# Why: docs/arnes/herramientas-arnes.md §3.2–3.5 and docs/arnes/plan-seguridad-codigo-ia.md §4.2.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "RUF", "S", "PLE", "C90", "PLR0912", "PLR0915"]
# S = flake8-bandit (security) · PLE includes PLE2502 (bidirectional Unicode, "Trojan Source")
# C90, PLR0912, PLR0915 = complexity, branches and statements per function: what SonarQube adds
# beyond security, with no server. Brownfield: `ruff check --add-noqa` marks the existing ones.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # assert and test passwords allowed ONLY in tests

[tool.mypy]
strict = true
files = ["src", "tests"]

# Brownfield: known debt. This list can only shrink.
# [[tool.mypy.overrides]]
# module = ["my_project.legacy.*"]
# ignore_errors = true   # issue #123

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80          # brownfield: the current coverage; only goes up
show_missing = true

[tool.uv]
# Cooldown: do not resolve versions published less than 7 days ago (requires uv >= 0.9.17).
# Malicious packages are usually pulled within hours or days.
exclude-newer = "7 days"
# Temporary exception for an urgent patch (remove it afterwards):
# exclude-newer-package = { urgent-package = false }

